services:
  postgres:
    image: postgres:16-alpine
    profiles:
      - postgres
    container_name: neurodent-postgres
    environment:
      POSTGRES_DB: neurodent
      POSTGRES_USER: neurodent
      POSTGRES_PASSWORD: neurodent
    ports:
      - "55432:5432"
    volumes:
      - neurodent-postgres:/var/lib/postgresql/data
      - ./next-app/backend/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    restart: unless-stopped

  neurodent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neurodent-app
    environment:
      NODE_ENV: production
      PORT: 3000
      NEURODENT_CORS_ORIGIN: http://localhost:3000
      NEURODENT_STORAGE_DRIVER: sqlite
      NEURODENT_DATABASE_URL: ""
      NEURODENT_POSTGRES_SSL: disable
      NEURODENT_POSTGRES_POOL_MAX: 5
      NEURODENT_POSTGRES_CONNECT_TIMEOUT_MS: 3000
      NEURODENT_POSTGRES_IDLE_TIMEOUT_MS: 30000
      NEURODENT_DATA_DIR: /app/next-app/backend/data
      NEURODENT_ALLOW_EPHEMERAL_STORAGE: "false"
      NEURODENT_EXPOSE_RESET_TOKEN: "false"
      NEURODENT_RATE_LIMIT_MAX: 300
      NEURODENT_RATE_LIMIT_WINDOW_MS: 60000
      NEURODENT_LOGIN_RATE_LIMIT_MAX: 20
      NEURODENT_MAX_BODY_BYTES: 1000000
      NEURODENT_EMAIL_WEBHOOK_URL: ""
      NEURODENT_SMS_WEBHOOK_URL: ""
      NEURODENT_WHATSAPP_WEBHOOK_URL: ""
      NEURODENT_FILE_STORAGE_WEBHOOK_URL: ""
      NEURODENT_FISCALIZATION_WEBHOOK_URL: ""
      NEURODENT_ESIGN_WEBHOOK_URL: ""
      NEURODENT_AI_WEBHOOK_URL: ""
    ports:
      - "3000:3000"
    volumes:
      - neurodent-data:/app/next-app/backend/data
    restart: unless-stopped

volumes:
  neurodent-data:
  neurodent-postgres:
