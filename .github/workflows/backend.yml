name: Backend

on:
  push:
    branches:
      - main
      - nextjs-setup
  pull_request:
    branches:
      - main
      - nextjs-setup

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Install Next.js dependencies
        working-directory: next-app
        run: npm ci

      - name: Check backend syntax
        run: |
          node --check backend/server.js
          node --check backend/service.js
          node --check backend/storage.js
          node --check backend/smoke-test.js

      - name: Run backend smoke test
        run: npm run test:backend

      - name: Build Next.js app
        working-directory: next-app
        run: npm run build
